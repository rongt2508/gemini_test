<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A CONVERGENT WEB MATRIX</title>
    <style>
        :root {
            --glow-color: #ffaa00;
            --bg-color: #0a0a10;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Top Header Info */
        .header-info {
            max-width: 320px;
            background: rgba(10, 10, 16, 0.5);
            padding: 20px;
            border-left: 3px solid #ff4500;
            backdrop-filter: blur(5px);
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,165,0,0.5);
        }

        .description {
            font-size: 12px;
            color: #ccc;
            line-height: 1.5;
        }

        /* Top Right Status Indicators */
        .status-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #444;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
        }
        .dot.active-1 { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
        .dot.active-2 { background: #4cd964; box-shadow: 0 0 8px #4cd964; }
        .dot.active-3 { background: #5ac8fa; box-shadow: 0 0 8px #5ac8fa; }

        /* Bottom Controls */
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 10px 24px;
            font-size: 12px;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            border-color: #ffaa00;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Hint for clicking */
        .click-hint {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="header-info">
            <div class="subtitle">A Convergent Web Matrix</div>
            <div class="title" id="shape-title">Quantum Gyroid Lattice</div>
            <div class="description" id="shape-desc">
                An intricate 3D gyroidal connection network transferring multi-layered quantum data state flows through non-euclidean space topology.
            </div>
        </div>

        <div class="status-panel">
            <div class="dot active-1"></div>
            <div class="dot active-2"></div>
            <div class="dot active-3"></div>
        </div>

        <div class="click-hint">点击任意处触发量子震荡波纹</div>

        <div class="control-panel">
            <button class="btn interactive" id="btn-next">Next Shape</button>
            <button class="btn interactive" id="btn-spin">Auto Spin: ON</button>
            <button class="btn interactive" id="btn-color">Color: Ember</button>
            <button class="btn interactive" id="btn-reset">Reset View</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Data & Content ---
        const shapesInfo = [
            {
                title: "Quantum Gyroid Lattice",
                desc: "An intricate 3D gyroidal connection network transferring multi-layered quantum data state flows through non-euclidean space topology.",
                border: "#ff4500"
            },
            {
                title: "Celestial Trefoil Multiverse",
                desc: "A continuous interlocking orbital matrix synchronized in an elegant 3D Trefoil-Knot formulation, representing multi-dimensional timeline loops.",
                border: "#ffa500"
            },
            {
                title: "Cosmic Neural Mandala",
                desc: "A nested sphere system capturing holographic neural activity, cycling dynamic frequencies from warm matrices into deep cosmic resonances.",
                border: "#da70d6"
            }
        ];

        let currentShapeIndex = 0;
        let autoSpin = true;

        // --- Color Themes (hue rotation applied to every palette) ---
        const colorThemes = [
            { name: 'Ember',    shift: 0.00 }, // 原版 红/橙/金
            { name: 'Cyan',     shift: 0.50 }, // 青/蓝
            { name: 'Verdant',  shift: 0.28 }, // 绿
            { name: 'Amethyst', shift: 0.72 }, // 紫
            { name: 'Rose',     shift: 0.88 }  // 粉
        ];
        let colorTheme = 0;

        // --- Core Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a10, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 75);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        // --- Post-Processing (Bloom Glow effect) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.6, 0.4, 0.1);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 2.2;
        bloomPass.radius = 0.8;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Interaction State ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let shockwaves = [];

        // --- Geometry Builders ---
        const activeGroup = new THREE.Group();
        scene.add(activeGroup);

        // Helper: Mix Colors easily
        function getMatrixColor(type, ratio, customFactor = 0) {
            const color = new THREE.Color();
            if (type === 0) { // Gyroid: Red/Yellow/Orange
                if (ratio > 0.6) color.setHSL(0.02 + ratio*0.05, 1.0, 0.55);
                else color.setHSL(0.08 + ratio*0.06, 1.0, 0.6);
            } else if (type === 1) { // Trefoil: Yellow/Golden/Orange Ribbon
                color.setHSL(0.07 + Math.sin(ratio * Math.PI) * 0.06, 1.0, 0.55);
            } else { // Mandala: Yellow -> Pink/Blue cycle
                if (customFactor === 0) {
                    color.setHSL(0.06 + ratio*0.05, 1.0, 0.55); // Warm
                } else {
                    color.setHSL(0.75 + ratio*0.1, 0.9, 0.6); // Cool Pink/Blue
                }
            }
            // Apply the selected color theme's hue rotation
            color.offsetHSL(colorThemes[colorTheme].shift, 0, 0);
            return color;
        }

        function buildShape(index) {
            // Clear current
            while(activeGroup.children.length > 0){
                const obj = activeGroup.children[0];
                activeGroup.remove(obj);
            }

            const particleCount = index === 1 ? 1600 : (index === 2 ? 1400 : 1000);
            const positions = [];
            const colors = [];
            const sizes = [];
            const originalColors = [];

            if (index === 0) {
                // Shape 1: Quantum Gyroid Lattice Approximation
                const size = 35;
                const steps = 12;
                for (let i = 0; i < particleCount; i++) {
                    let x = (Math.random() - 0.5) * size;
                    let y = (Math.random() - 0.5) * size;
                    let z = (Math.random() - 0.5) * size;

                    // Filter or shift points to create lattice-like tendrils
                    const wave = Math.sin(x*0.3) * Math.cos(y*0.3) + Math.sin(y*0.3) * Math.cos(z*0.3) + Math.sin(z*0.3) * Math.cos(x*0.3);
                    if (Math.abs(wave) > 0.4) {
                        x += Math.sin(z)*1.5;
                        y += Math.cos(x)*1.5;
                    }

                    positions.push(x, y, z);
                    const c = getMatrixColor(0, Math.random());
                    colors.push(c.r, c.g, c.b);
                    originalColors.push(c.r, c.g, c.b);
                    sizes.push(Math.random() * 2.5 + 1.0);
                }
            }
            else if (index === 1) {
                // Shape 2: Celestial Trefoil Multiverse
                for (let i = 0; i < particleCount; i++) {
                    const t = (i / particleCount) * Math.PI * 2 * 3; // multiple loops
                    const r = 16 + Math.sin(i * 0.1) * 2.5; // thickness variation

                    // Trefoil knot standard equations
                    let x = Math.sin(t) + 2 * Math.sin(2 * t);
                    let y = Math.cos(t) - 2 * Math.cos(2 * t);
                    let z = -Math.sin(3 * t);

                    // Scale up
                    x *= 8; y *= 8; z *= 8;

                    // Add structural fuzz/ribbon texture
                    const angle = Math.random() * Math.PI * 2;
                    const offset = Math.random() * 3.5;
                    x += Math.cos(angle) * offset;
                    y += Math.sin(angle) * offset;
                    z += Math.sin(angle * 2) * offset;

                    positions.push(x, y, z);
                    const c = getMatrixColor(1, i / particleCount);
                    colors.push(c.r, c.g, c.b);
                    originalColors.push(c.r, c.g, c.b);
                    sizes.push(Math.random() * 2.0 + 1.2);
                }
            }
            else if (index === 2) {
                // Shape 3: Cosmic Neural Mandala (Concentric layered web structure)
                // Layer 1: Core Shell
                for (let i = 0; i < particleCount * 0.4; i++) {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = 15 + (Math.random() - 0.5) * 2;

                    const x = r * Math.sin(phi) * Math.cos(theta);
                    const y = r * Math.sin(phi) * Math.sin(theta);
                    const z = r * Math.cos(phi);

                    positions.push(x, y, z);
                    const c = getMatrixColor(2, Math.random(), 0); // Yellow/Warm Core
                    colors.push(c.r, c.g, c.b);
                    originalColors.push(c.r, c.g, c.b);
                    sizes.push(Math.random() * 2.0 + 1.5);
                }
                // Layer 2: Outer Complex Ring Sphere
                for (let i = 0; i < particleCount * 0.6; i++) {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = 28 + Math.sin(theta * 6) * 2; // Patterned radius

                    const x = r * Math.sin(phi) * Math.cos(theta);
                    const y = r * Math.sin(phi) * Math.sin(theta);
                    const z = r * Math.cos(phi);

                    positions.push(x, y, z);
                    const c = getMatrixColor(2, Math.random(), 1); // Cool Blue/Pink outer
                    colors.push(c.r, c.g, c.b);
                    originalColors.push(c.r, c.g, c.b);
                    sizes.push(Math.random() * 2.5 + 1.0);
                }
            }

            // Create Points Geometry
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Custom Points Material to look beautiful and bright
            const textureLoader = new THREE.TextureLoader();
            // Use a procedural bright circle dot via canvas data URL
            const dotTexture = createCircleTexture();

            const material = new THREE.PointsMaterial({
                size: 1.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                map: dotTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particleSystem = new THREE.Points(geometry, material);
            activeGroup.add(particleSystem);

            // Create Intelligent Interconnecting Mesh Lines
            const linePositions = [];
            const lineColors = [];
            const posArr = geometry.attributes.position.array;
            const colArr = geometry.attributes.color.array;

            // Connect nearby points to form the lattice web
            const maxConnections = index === 1 ? 3 : 4;
            const minDist = index === 1 ? 5.0 : (index === 2 ? 7.0 : 8.5);

            for (let i = 0; i < posArr.length / 3; i += 2) { // sample half for performance optimization
                let connections = 0;
                const x1 = posArr[i*3];
                const y1 = posArr[i*3+1];
                const z1 = posArr[i*3+2];

                for (let j = i + 1; j < posArr.length / 3; j++) {
                    if (connections >= maxConnections) break;

                    const x2 = posArr[j*3];
                    const y2 = posArr[j*3+1];
                    const z2 = posArr[j*3+2];

                    const dx = x1 - x2;
                    const dy = y1 - y2;
                    const dz = z1 - z2;
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                    if (dist < minDist) {
                        linePositions.push(x1, y1, z1);
                        linePositions.push(x2, y2, z2);

                        // Lines absorb vertex color shades
                        lineColors.push(colArr[i*3], colArr[i*3+1], colArr[i*3+2]);
                        lineColors.push(colArr[j*3], colArr[j*3+1], colArr[j*3+2]);
                        connections++;
                    }
                }
            }

            const lineGeometry = new THREE.BufferGeometry();
            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

            const lineMaterial = new THREE.LineBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const lineSystem = new THREE.LineSegments(lineGeometry, lineMaterial);
            activeGroup.add(lineSystem);

            // Stash references for animation logic
            activeGroup.userData = {
                particleSystem: particleSystem,
                lineSystem: lineSystem,
                originalColors: originalColors,
                baseSizes: sizes
            };
        }

        // Procedural soft circle particle generator
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 240, 200, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- Interaction Logic ---
        function triggerShockwave(point) {
            shockwaves.push({
                center: point.clone(),
                radius: 0.0,
                maxRadius: 45.0,
                speed: 1.2,
                thickness: 4.5
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('interactive')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check intersection with our particle mesh bounding box/system
            if(activeGroup.userData.particleSystem) {
                const intersects = raycaster.intersectObject(activeGroup.userData.particleSystem);
                if (intersects.length > 0) {
                    triggerShockwave(intersects[0].point);
                } else {
                    // Fallback to vector calculation close to center
                    const targetVec = new THREE.Vector3();
                    raycaster.ray.at(40, targetVec);
                    triggerShockwave(targetVec);
                }
            }
        });

        // --- UI Operations ---
        function updateUI() {
            const info = shapesInfo[currentShapeIndex];
            document.getElementById('shape-title').innerText = info.title;
            document.getElementById('shape-desc').innerText = info.desc;
            document.querySelector('.header-info').style.borderLeftColor = info.border;

            // Dot status tracking
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.style.opacity = (index === currentShapeIndex) ? '1' : '0.2';
            });
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            currentShapeIndex = (currentShapeIndex + 1) % shapesInfo.length;
            buildShape(currentShapeIndex);
            updateUI();
        });

        const spinBtn = document.getElementById('btn-spin');
        spinBtn.addEventListener('click', () => {
            autoSpin = !autoSpin;
            spinBtn.innerText = `Auto Spin: ${autoSpin ? 'ON' : 'OFF'}`;
        });

        const colorBtn = document.getElementById('btn-color');
        colorBtn.addEventListener('click', () => {
            colorTheme = (colorTheme + 1) % colorThemes.length;
            buildShape(currentShapeIndex);
            colorBtn.innerText = 'Color: ' + colorThemes[colorTheme].name;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            controls.reset();
            camera.position.set(0, 0, 75);
            activeGroup.rotation.set(0,0,0);
        });

        // --- Handle Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Core Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update();

            // Auto Rotation Effect
            if (autoSpin) {
                activeGroup.rotation.y += 0.12 * delta;
                activeGroup.rotation.x += 0.04 * delta;
            }

            // Wave Ripple Calculation System
            if (activeGroup.userData.particleSystem) {
                const pSystem = activeGroup.userData.particleSystem;
                const posAttr = pSystem.geometry.attributes.position;
                const colAttr = pSystem.geometry.attributes.color;
                const sizeAttr = pSystem.geometry.attributes.size;

                const origCols = activeGroup.userData.originalColors;
                const baseSizes = activeGroup.userData.baseSizes;

                // Update Wave Radius status
                for (let w = shockwaves.length - 1; w >= 0; w--) {
                    shockwaves[w].radius += shockwaves[w].speed;
                    if (shockwaves[w].radius > shockwaves[w].maxRadius) {
                        shockwaves.splice(w, 1);
                    }
                }

                // Apply deformation and light burst tracking per frame
                if(shockwaves.length > 0) {
                    const localCenter = new THREE.Vector3();

                    for (let i = 0; i < posAttr.count; i++) {
                        let x = posAttr.getX(i);
                        let y = posAttr.getY(i);
                        let z = posAttr.getZ(i);

                        // Dynamic particle world vector point mapping
                        const worldPoint = new THREE.Vector3(x, y, z).applyMatrix4(activeGroup.matrixWorld);

                        let totalGlow = 0;

                        for (let w = 0; w < shockwaves.length; w++) {
                            const wave = shockwaves[w];
                            const dist = worldPoint.distanceTo(wave.center);

                            // Check if inside the pulse ring range
                            if (dist > wave.radius - wave.thickness && dist < wave.radius + wave.thickness) {
                                const factor = 1.0 - (Math.abs(dist - wave.radius) / wave.thickness);
                                totalGlow += factor * 2.5;
                            }
                        }

                        // Apply color ignition and scaling flash
                        if (totalGlow > 0) {
                            colAttr.setXYZ(i,
                                Math.min(origCols[i*3] + totalGlow * 0.8, 1.0),
                                Math.min(origCols[i*3+1] + totalGlow * 0.9, 1.0),
                                Math.min(origCols[i*3+2] + totalGlow * 1.0, 1.0)
                            );
                            sizeAttr.setX(i, baseSizes[i] * (1.0 + totalGlow * 1.8));
                        } else {
                            // Smooth interpolation restoration
                            colAttr.setXYZ(i,
                                THREE.MathUtils.lerp(colAttr.getX(i), origCols[i*3], 0.1),
                                THREE.MathUtils.lerp(colAttr.getY(i), origCols[i*3+1], 0.1),
                                THREE.MathUtils.lerp(colAttr.getZ(i), origCols[i*3+2], 0.1)
                            );
                            sizeAttr.setX(i, THREE.MathUtils.lerp(sizeAttr.getX(i), baseSizes[i], 0.1));
                        }
                    }
                    posAttr.needsUpdate = true;
                    colAttr.needsUpdate = true;
                    sizeAttr.needsUpdate = true;
                }
            }

            // Floating Idle Amplitude wave effect to feel alive
            if(currentShapeIndex === 2 && activeGroup.userData.particleSystem) {
                // Let the neural mandala slightly expand and contract over time rhythmically
                const scale = 1.0 + Math.sin(time * 1.5) * 0.03;
                activeGroup.userData.particleSystem.scale.set(scale, scale, scale);
                if(activeGroup.userData.lineSystem) activeGroup.userData.lineSystem.scale.set(scale, scale, scale);
            } else {
                activeGroup.userData.particleSystem.scale.set(1,1,1);
                if(activeGroup.userData.lineSystem) activeGroup.userData.lineSystem.scale.set(1,1,1);
            }

            composer.render();
        }

        // --- Initialization ---
        buildShape(0);
        updateUI();
        animate();
    </script>
</body>
</html>
